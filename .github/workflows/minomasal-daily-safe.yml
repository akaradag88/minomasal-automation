name: MinoMasal Daily Safe Preflight (No Publish)

on:
  workflow_dispatch:
  # Future daily publishing time: 18:00 Europe/Istanbul = 15:00 UTC.
  # Keep schedule DISABLED until all publishing tests and duplicate guards pass.
  # schedule:
  #   - cron: '0 15 * * *'

permissions:
  contents: read

concurrency:
  group: minomasal-preview-state
  cancel-in-progress: false

jobs:
  safe-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout private automation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        with:
          python-version: '3.11'
      - name: Validate state and next story without any upload
        run: python minomasal_daily.py --mode preflight
