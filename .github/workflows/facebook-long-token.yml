
name: MinoMasal Facebook Long Token (No Publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exchange-token:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      
      - name: Install encryption library
        run: python -m pip install PyNaCl

      - name: Exchange and securely store Facebook token
        env:
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          FACEBOOK_SHORT_USER_TOKEN: ${{ secrets.FACEBOOK_SHORT_USER_TOKEN }}
          MINOMASAL_GITHUB_TOKEN: ${{ secrets.MINOMASAL_GITHUB_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}

        run: python facebook_long_token.py
