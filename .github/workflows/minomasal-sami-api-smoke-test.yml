name: MinoMasal Sami TTS API 9.12 (NO PUBLISH)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sami-api-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        with:
          python-version: '3.11'
      - name: Install current Gemini SDK
        run: python -m pip install --disable-pip-version-check 'google-genai>=2.25.0,<3'
      - name: Short Sami test (NO PUBLISH)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINOMASAL_GEMINI_FREE_TIER_CONFIRMED: ${{ vars.MINOMASAL_GEMINI_FREE_TIER_CONFIRMED || 'false' }}
        run: |
          python - <<'PY'
          import wave
          from minomasal_sami_tts_interactions import create_sami_wav
          output = create_sami_wav("Merhaba! Bugün MinoMasal'da yepyeni bir hikâye dinleyeceğiz.", "sami_api_test.wav")
          with wave.open(str(output), "rb") as w:
              print("SAMI_API_TTS_OK", "sample_rate=", w.getframerate(), "duration=", round(w.getnframes()/w.getframerate(), 2))
          print("TEST_ONLY_NO_PUBLISH")
          PY
      - name: Save private test WAV artifact
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: sami-tts-9-12-smoke-test
          path: sami_api_test.wav
          if-no-files-found: error
          retention-days: 1
