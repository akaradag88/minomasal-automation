
name: MinoMasal Instagram Recovery 17

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minomasal-preview-state
  cancel-in-progress: false

jobs:
  instagram-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish story 17 to Instagram
        env:
          PUBLISH_ENABLED: 'true'
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python minomasal_instagram_recovery.py

      - name: Save Instagram publication status
        if: always()
        run: |
          if ! git diff --quiet -- minomasal_platform_durumu.json; then
            git add minomasal_platform_durumu.json
            git commit -m "Record Instagram recovery status for story 17"
            git push origin HEAD:main
          fi
