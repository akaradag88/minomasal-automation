
name: MinoMasal Instagram Recovery 17

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minomasal-preview-state
  cancel-in-progress: false

jobs:
  instagram-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        with:
          python-version: '3.11'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish story 17 to Instagram
        env:
          PUBLISH_ENABLED: 'true'
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python minomasal_instagram_recovery.py

      - name: Save Instagram publication status
        if: always()
        run: |
          if ! git diff --quiet -- minomasal_platform_durumu.json; then
            git add minomasal_platform_durumu.json
            git commit -m "Record Instagram recovery status for story 17"
            git push origin HEAD:main
          fi
