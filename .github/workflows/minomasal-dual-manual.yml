name: MinoMasal Dual Publish Manual
on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful main preparation run ID containing the reviewed MP4
        required: true
        type: string
      story_number:
        description: Exact story number in that artifact
        required: true
        type: string
        default: '47'
      approved_video_sha256:
        description: SHA256 of the exact MP4 the user reviewed and approved
        required: true
        type: string
      publish_enabled:
        description: Explicit final user approval for this exact MP4 on both platforms
        type: boolean
        default: false
      resume_partial:
        description: Explicit same-day retry ONLY of a pending platform, same video; ambiguous states never retry
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: minomasal-preview-state
  cancel-in-progress: false
jobs:
  validate-approved-artifact:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-minomasal-engine.lock.txt
      - run: bash scripts/install-minomasal-dependencies.sh system
        timeout-minutes: 8
      - run: timeout --signal=TERM --kill-after=15s 8m python -m pip install --disable-pip-version-check --no-input --timeout 30 --retries 2 --require-hashes -r requirements-minomasal-engine.lock.txt
        timeout-minutes: 10
      - name: Download the existing video (never regenerate)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.staging_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "minomasal-preparation-$SOURCE_RUN" --dir prepared
      - name: Verify trusted source, hash approval, receipt, decode and quality (read only)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.staging_run_id }}
          STORY_NUMBER: ${{ inputs.story_number }}
          APPROVED_SHA: ${{ inputs.approved_video_sha256 }}
        run: python minomasal_approved_publish.py --source-run "$SOURCE_RUN" --number "$STORY_NUMBER" --approved-sha256 "$APPROVED_SHA"
  publish-exact-video:
    if: github.ref == 'refs/heads/main' && inputs.publish_enabled
    needs: validate-approved-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-minomasal-engine.lock.txt
      - run: bash scripts/install-minomasal-dependencies.sh system
        timeout-minutes: 8
      - run: timeout --signal=TERM --kill-after=15s 8m python -m pip install --disable-pip-version-check --no-input --timeout 30 --retries 2 --require-hashes -r requirements-minomasal-engine.lock.txt
        timeout-minutes: 10
      - name: Download the same approved artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.staging_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "minomasal-preparation-$SOURCE_RUN" --dir prepared
      - name: Configure ledger commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify platform access, reserve atomically and publish exact approved bytes
        env:
          GH_TOKEN: ${{ github.token }}
          MINOMASAL_LOCK_TOKEN: ${{ github.token }}
          MINOMASAL_LOCK_START_DATE: '2026-11-04'
          SOURCE_RUN: ${{ inputs.staging_run_id }}
          STORY_NUMBER: ${{ inputs.story_number }}
          APPROVED_SHA: ${{ inputs.approved_video_sha256 }}
          RESUME_PARTIAL: ${{ inputs.resume_partial }}
          PUBLISH_ENABLED: 'true'
          MINOMASAL_YOUTUBE_PRIVACY: public
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          MINOMASAL_HOSTING_TOKEN: ${{ secrets.MINOMASAL_HOSTING_TOKEN }}
        run: |
          set -euo pipefail
          resume_args=()
          if [ "$RESUME_PARTIAL" = 'true' ]; then resume_args+=(--resume); fi
          python minomasal_approved_publish.py --source-run "$SOURCE_RUN" --number "$STORY_NUMBER" --approved-sha256 "$APPROVED_SHA" --publish "${resume_args[@]}"
      - name: Stop and reconcile on failure (never replay uploads automatically)
        if: failure()
        run: echo '::error::Publication stopped. Check persisted IDs, platform responses and daily reservation before an explicit retry.'
