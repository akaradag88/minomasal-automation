
name: MinoMasal YouTube Baglanti Testi

on:
  workflow_dispatch:

jobs:
  youtube-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli kutuphaneler
        run: pip install google-auth requests

      - name: YouTube OAuth baglantisini test et
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          import re
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request

          required = [
              "YOUTUBE_CLIENT_ID",
              "YOUTUBE_CLIENT_SECRET",
              "YOUTUBE_REFRESH_TOKEN"
          ]

          missing = [name for name in required if not os.getenv(name)]

          if missing:
              print("❌ Eksik GitHub Secrets:", ", ".join(missing))
              sys.exit(1)

          try:
              credentials = Credentials(
                  token=None,
                  refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
                  token_uri="https://oauth2.googleapis.com/token",
                  client_id=os.environ["YOUTUBE_CLIENT_ID"],
                  client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
                  scopes=["https://www.googleapis.com/auth/youtube.upload"]
              )

              credentials.refresh(Request())

              if not credentials.valid:
                  raise RuntimeError("OAuth credentials gecersiz")

              print("✅ YouTube OAuth baglantisi basarili!")
              print("✅ Refresh token calisiyor.")
              print("🔒 Video uretilmedi veya yuklenmedi.")

          except Exception as exc:
              print("❌ OAuth baglanti testi basarisiz.")
              print("Hata turu:", type(exc).__name__)
              # Yalnizca bilinen OAuth hata kodunu goster; token ve sunucu yanitini yazdirma.
              details = " ".join(str(x) for x in getattr(exc, "args", ()))
              known_codes = (
                  "invalid_grant", "invalid_client", "unauthorized_client",
                  "invalid_scope", "access_denied", "temporarily_unavailable",
                  "invalid_request", "deleted_client", "org_internal",
              )
              found = next((code for code in known_codes
                            if re.search(r"(?<![a-z_])" + re.escape(code) + r"(?![a-z_])", details.lower())), None)
              print("Google OAuth hata kodu:", found or "Belirlenemedi")
              print("Guvenlik nedeniyle hata yanitinin tam metni gizlendi.")
              sys.exit(1)
          PY
