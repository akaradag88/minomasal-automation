name: MinoMasal Daily YouTube Instagram (19 TR)

on:
  schedule:
    - cron: '0 16 */2 * *'  # iki günde bir, 19:00 Europe/Istanbul (UTC+3 year-round)
  workflow_dispatch:
    inputs:
      number:
        description: "Yalnız ÖNİZLEME: üretilecek konu numarası (boş bırakırsanız sıradaki masal)"
        required: false
        default: ""
        type: string
      publish:
        description: "Gerçek yayın için YES yazın (numara doluysa yayın HER ZAMAN kapalıdır)"
        required: false
        default: "NO"
        type: string

permissions:
  contents: write

concurrency:
  group: minomasal-preview-state
  cancel-in-progress: false

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout latest ledger
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-minomasal.txt
          python -m pip install google-api-python-client google-auth google-auth-httplib2
      - name: Generate next video from ledger
        id: stage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MINOMASAL_YOUTUBE_UPLOAD: 'false'
          MINOMASAL_FORCE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.number || '' }}
        run: python minomasal_daily_live.py
      - name: Save review files to a GitHub pre-release (no Actions artifact quota)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p review
          [ -d staging ] && cp -r staging review/staging || true
          for d in minomasal_data/*/; do
            [ -d "${d}gorseller" ] && cp -r "${d}gorseller" review/gorseller || true
            [ -d "${d}karakterler" ] && cp -r "${d}karakterler" review/karakterler || true
            cp "${d}gorsel_kontrol.json" "${d}hikaye.json" review/ 2>/dev/null || true
          done
          if [ -z "$(ls -A review)" ]; then echo "No review files produced."; exit 0; fi
          (cd review && zip -qr ../minomasal-onizleme.zip .)
          ASSETS="minomasal-onizleme.zip"
          [ -f staging/masal_short.mp4 ] && ASSETS="$ASSETS staging/masal_short.mp4"
          gh release create "onizleme-${{ github.run_id }}" $ASSETS --prerelease \
            --title "MinoMasal onizleme ${{ github.run_id }}" \
            --notes "Onizleme dosyalari. Bu bir yayin degildir."
      - name: Configure Git identity
        if: steps.stage.outputs.number != '' && (github.event_name == 'schedule' || inputs.publish == 'YES')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      
      - name: Sync latest GitHub state before publishing
        if: steps.stage.outputs.number != '' && (github.event_name == 'schedule' || inputs.publish == 'YES')
        run: |
          git fetch origin main
          git diff --quiet || {
            echo "Tracked files have local changes; refusing to discard them."
            exit 1
          }
          git diff --cached --quiet || {
            echo "Staged changes exist; refusing to discard them."
            exit 1
          }
          git reset --hard origin/main
          git status --short
     
      - name: Publish same video to YouTube and Instagram
        if: steps.stage.outputs.number != '' && (github.event_name == 'schedule' || inputs.publish == 'YES')
        env:
          PUBLISH_ENABLED: 'true'
          MINOMASAL_YOUTUBE_PRIVACY: public
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          MINOMASAL_HOSTING_TOKEN: ${{ secrets.MINOMASAL_HOSTING_TOKEN }}
        run: python minomasal_dual_publish.py --stage staging --number '${{ steps.stage.outputs.number }}'
