name: MinoMasal Daily YouTube Instagram (19 TR)

# 19:07 Europe/Istanbul = 16:07 UTC. Dis tetikleyici de gunluk kilide tabidir.
on:
  schedule:
    - cron: '7 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minomasal-preview-state
  cancel-in-progress: false

jobs:
  produce-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout latest ledger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        timeout-minutes: 5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-minomasal.txt
            requirements-minomasal-daily.txt
      - name: Runner resource diagnostics (no environment or secrets)
        run: |
          set -euo pipefail
          df -h /
          free -h
        timeout-minutes: 1
      - name: Install system dependencies (bounded APT)
        timeout-minutes: 8
        run: bash scripts/install-minomasal-dependencies.sh system
      - name: Install Python dependencies (cached, bounded pip)
        timeout-minutes: 10
        run: bash scripts/install-minomasal-dependencies.sh python
      - name: Verify installed dependencies (no generation)
        timeout-minutes: 2
        run: bash scripts/install-minomasal-dependencies.sh verify
      - name: Check daily slot (read only)
        id: daycheck
        env:
          MINOMASAL_LOCK_TOKEN: ${{ github.token }}
          MINOMASAL_LOCK_START_DATE: '2026-11-04'
        run: python minomasal_gunluk_kilit.py preflight
      - name: Prepare existing canonical story review packet (offline, never a video)
        if: steps.daycheck.outputs.eligible == 'true'
        timeout-minutes: 1
        run: python minomasal_recovery_package.py
      - name: Generate next video from ledger (Quality V3)
        id: stage
        # Recovery hold: paid text generation and unapproved visuals must not run.
        # Remove only after a tested free pipeline and reviewed real assets exist.
        if: ${{ false }}
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINOMASAL_YOUTUBE_UPLOAD: 'false'
        run: python minomasal_v4_gunluk_stage.py
      - name: Reserve daily publication slot (atomic)
        id: daylock
        if: ${{ false }}
        env:
          MINOMASAL_LOCK_TOKEN: ${{ github.token }}
          MINOMASAL_LOCK_START_DATE: '2026-11-04'
        run: python minomasal_gunluk_kilit.py acquire --number '${{ steps.stage.outputs.number }}'
      - name: Sync latest GitHub state after reservation
        if: ${{ false }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --ff-only origin/main
      - name: Check lock ownership before publish
        if: ${{ false }}
        env:
          MINOMASAL_LOCK_TOKEN: ${{ github.token }}
        run: python minomasal_gunluk_kilit.py verify --number '${{ steps.stage.outputs.number }}' --day '${{ steps.daylock.outputs.day }}'
      - name: Configure Git identity
        if: ${{ false }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish same video to YouTube and Instagram
        if: ${{ false }}
        env:
          PUBLISH_ENABLED: 'false'
          MINOMASAL_ENFORCE_DAILY_LOCK: 'true'
          MINOMASAL_LOCK_DAY: ${{ steps.daylock.outputs.day }}
          MINOMASAL_LOCK_TOKEN: ${{ github.token }}
          MINOMASAL_YOUTUBE_PRIVACY: public
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          MINOMASAL_HOSTING_TOKEN: ${{ secrets.MINOMASAL_HOSTING_TOKEN }}
        run: python minomasal_dual_publish.py --stage staging --number '${{ steps.stage.outputs.number }}'
      - name: Mark daily lock as published
        if: ${{ false }}
        env:
          MINOMASAL_LOCK_TOKEN: ${{ github.token }}
        run: python minomasal_gunluk_kilit.py finish --number '${{ steps.stage.outputs.number }}' --day '${{ steps.daylock.outputs.day }}'
      - name: Explain recovery hold (no generation, reservation or publishing)
        if: always()
        run: |
          echo '## Publication blocked safely' >> "$GITHUB_STEP_SUMMARY"
          echo 'The schedule is healthy. Production is held for Pollinations HTTP 402, unapproved character assets, and incomplete YouTube read verification. No video has been approved.' >> "$GITHUB_STEP_SUMMARY"
          echo 'See docs/recovery-2026-11-12.md. A successful preflight is not a successful production or publication.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save preparation outputs for manual review (never publish)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minomasal-preparation-${{ github.run_id }}
          path: |
            recovery_package/
            staging/
            minomasal_kalite_v3_daily_data/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14
