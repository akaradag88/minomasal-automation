
name: MinoMasal Python Testi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-test:
    runs-on: ubuntu-latest

    steps:
      - name: Proje dosyalarini al
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python sozdizimini kontrol et
        run: |
          python -m py_compile minomasal.py
          python -m py_compile minomasal_facebook_cover.py


      - name: FFmpeg kur ve kontrol et
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version


      - name: Kapak kodunu kontrol et
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("minomasal.py").read_text(encoding="utf-8")
          assert 'kapak_2sn.jpg' in source
          print("2. saniye kapak olusturma kodu mevcut.")
          PY

          
      - name: Test Facebook cover video (No Publish)
        run: |
          mkdir -p cover_test

          ffmpeg -y -loglevel error \
            -f lavfi -i "testsrc2=size=720x1280:rate=25:duration=5" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=5" \
            -c:v libx264 -pix_fmt yuv420p \
            -c:a aac -shortest cover_test/source.mp4

          python - <<'PY'
          from minomasal_facebook_cover import create_facebook_cover_video

          create_facebook_cover_video(
              "cover_test/source.mp4",
              "cover_test/facebook.mp4"
          )
          PY

          ffprobe -v error \
            -show_entries stream=codec_type \
            -of csv=p=0 cover_test/facebook.mp4

          echo "Facebook kapakli video testi tamamlandi."


      - name: Save Facebook cover test video
        uses: actions/upload-artifact@v4
        with:
          name: minomasal-facebook-cover-test
          path: cover_test/facebook.mp4
          retention-days: 1

      - name: Download existing MinoMasal video (No Publish)
        run: |
          mkdir -p cover_test/real

          curl --fail --location --retry 2 \
            --output cover_test/real/source.mp4 \
            "https://github.com/akaradag88/minomasal-video-hosting/releases/download/minomasal-story-21/minomasal-21.mp4"

          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            cover_test/real/source.mp4

          echo "Mevcut MinoMasal videosu indirildi."
