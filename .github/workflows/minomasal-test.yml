
name: MinoMasal Python Testi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-test:
    runs-on: ubuntu-latest

    steps:
      - name: Proje dosyalarini al
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python sozdizimini kontrol et
        run: |
          python -m py_compile minomasal.py
          python -m py_compile minomasal_facebook_cover.py


      - name: FFmpeg kur ve kontrol et
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version


      - name: Kapak kodunu kontrol et
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("minomasal.py").read_text(encoding="utf-8")
          assert 'kapak_2sn.jpg' in source
          print("2. saniye kapak olusturma kodu mevcut.")
          PY
