name: MinoMasal Video Onizleme

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minomasal-preview-state
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements-minomasal.txt
          pip install google-genai
      - name: Render one preview (no upload)
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINOMASAL_YOUTUBE_UPLOAD: 'false'
        run: python minomasal.py
      - name: Downloadable preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minomasal-preview
          path: |
            minomasal_data/minomasal_test_video.mp4
            minomasal_data/test_ozeti.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save preview progress
        if: success()
        run: |
          if [ ! -f minomasal_onizleme_durumu.json ]; then
            echo 'No preview progress to save.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minomasal_onizleme_durumu.json
          if git diff --cached --quiet; then
            echo 'No new progress.'
            exit 0
          fi
          git commit -m 'Record MinoMasal preview progress [skip ci]'
          git push origin HEAD:${{ github.event.repository.default_branch }}
