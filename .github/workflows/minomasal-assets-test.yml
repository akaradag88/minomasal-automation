name: MinoMasal approved asset composition test (NO PUBLISH)
on:
  workflow_dispatch:
    inputs:
      generate_images:
        description: 'At most two background-only images, after verified free plan/quota'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: minomasal-asset-test-${{ github.ref }}
  cancel-in-progress: false
jobs:
  asset-test:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/adim-10-9-free-image-providers'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        timeout-minutes: 5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-minomasal.txt
            requirements-minomasal-daily.txt
      - name: Install system dependencies (bounded)
        timeout-minutes: 8
        run: bash scripts/install-minomasal-dependencies.sh system
      - name: Install local OCR for real text-detection tests (bounded)
        timeout-minutes: 6
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 2m sudo -n apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 update
          timeout --signal=TERM --kill-after=15s 3m sudo -n env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 install --yes --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Install Python dependencies (bounded)
        timeout-minutes: 10
        run: bash scripts/install-minomasal-dependencies.sh python
      - name: Install test tooling (bounded)
        timeout-minutes: 2
        run: timeout --signal=TERM --kill-after=15s 90s python -m pip install --disable-pip-version-check --no-input --timeout 30 --retries 2 PyYAML
      - name: Full offline suite before any optional API call
        timeout-minutes: 5
        run: python run_readiness_tests.py
      - name: Compose synthetic proxies with offline backgrounds
        if: ${{ !inputs.generate_images }}
        timeout-minutes: 3
        run: python minomasal_asset_demo.py
      - name: Optional two free backgrounds and preview composition (never character generation)
        if: ${{ inputs.generate_images }}
        timeout-minutes: 10
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_USAGE_TOKEN: ${{ secrets.CLOUDFLARE_USAGE_TOKEN }}
        run: python minomasal_asset_demo.py --generate-backgrounds
      - name: Save asset test report and preview frames
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minomasal-assets-${{ github.run_id }}
          path: asset_test_output/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14
