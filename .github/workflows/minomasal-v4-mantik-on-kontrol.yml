name: MinoMasal V4 Hikaye Mantik On Kontrolu (NO PUBLISH)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        with:
          python-version: '3.11'
      - name: Read-only actor and story tests (NO API, NO PUBLISH)
        run: |
          python -m unittest -v test_minomasal_v4_mantik_kontrol.py
          echo 'V4_MANTIK_PREFLIGHT_OK'
