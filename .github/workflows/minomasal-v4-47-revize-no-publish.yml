name: MinoMasal V4 47 Revize Referansli Pilot (NO PUBLISH)

on:
  workflow_dispatch:
    inputs:
      render_video:
        description: 'Ref-guided actual rendering; consumes image edits + Gemini TTS; NO PUBLISH'
        required: true
        type: boolean
        default: false
      image_edit_model:
        description: 'Pollinations reference-image editing model'
        required: true
        type: choice
        options:
          - kontext
        default: kontext

permissions:
  contents: read

concurrency:
  group: minomasal-preview-state
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        with:
          python-version: '3.11'
      - name: Free local preflight (NO PUBLISH)
        env:
          PUBLISH_ENABLED: 'false'
          MINOMASAL_YOUTUBE_UPLOAD: 'false'
          MINOMASAL_30SN_TEST: 'false'
        run: |
          python -m pip install --disable-pip-version-check pillow requests
          python minomasal_v4_47_revize_pilot.py
          python -m unittest -q test_minomasal_v4_47_revize.py
      - name: Install FFmpeg + all rendering dependencies
        if: ${{ inputs.render_video == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET='ffmpeg-master-latest-linux64-gpl.tar.xz'
          gh release download latest --repo 'BtbN/FFmpeg-Builds' --pattern "$ASSET" --pattern checksums.sha256 --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          grep -F "$ASSET" checksums.sha256 | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$ASSET" -C "$RUNNER_TEMP/ffmpeg"
          FFMPEG_BIN="$(find "$RUNNER_TEMP/ffmpeg" -type f -name ffmpeg -print -quit)"
          test -n "$FFMPEG_BIN"
          echo "$(dirname "$FFMPEG_BIN")" >> "$GITHUB_PATH"
          python -m pip install --disable-pip-version-check -r "$GITHUB_WORKSPACE/requirements-minomasal.txt"
          python -m pip install --disable-pip-version-check 'faster-whisper>=1.1,<2'
      - name: Render reference-guided scene images and video (NO PUBLISH)
        if: ${{ inputs.render_video == true }}
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINOMASAL_IMAGE_EDIT_MODEL: ${{ inputs.image_edit_model }}
          PUBLISH_ENABLED: 'false'
          MINOMASAL_YOUTUBE_UPLOAD: 'false'
          MINOMASAL_30SN_TEST: 'false'
        run: python minomasal_v4_47_revize_pilot.py --render
      - name: Save MP4 + each of 10 pictures + JSON (NO PUBLISH)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minomasal-v4-47-revize-review-no-publish
          retention-days: 5
          if-no-files-found: warn
          path: |
            minomasal_v4_47_revize_pilot_rapor.json
            minomasal_v4_47_revize_pilot_data/**/masal_short.mp4
            minomasal_v4_47_revize_pilot_data/**/hikaye.json
            minomasal_v4_47_revize_pilot_data/**/altyazi.srt
            minomasal_v4_47_revize_pilot_data/**/sahne_karsilastirma.jpg
            minomasal_v4_47_revize_pilot_data/**/gorseller/*.jpg
