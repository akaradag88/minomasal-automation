
name: MinoMasal Facebook Recovery 19


on:
  workflow_dispatch:
    inputs:
      confirm_finish:
        description: "Mevcut Facebook videosunu yayımlamak için YES yazın"
        required: true
        default: "NO"
        type: string


concurrency:
  group: minomasal-facebook-recovery-19
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recovery:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: python -m py_compile minomasal_facebook_publish.py

      - name: Check existing Facebook video (No Publish)
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          from minomasal_facebook_publish import recover_facebook_reel_19
          recover_facebook_reel_19()
          PY
          
      - name: Finish existing Facebook Reel 19
        if: ${{ inputs.confirm_finish == 'YES' }}
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PUBLISH_ENABLED: 'true'
          FACEBOOK_CONFIRM_PUBLISH: 'YES'
        run: |
          python - <<'PY'
          from minomasal_facebook_publish import finish_existing_facebook_reel_19
          finish_existing_facebook_reel_19()
          PY

