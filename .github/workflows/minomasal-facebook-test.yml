
name: MinoMasal Facebook Connection Test (No Publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-facebook:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Facebook connection
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python minomasal_facebook_publish.py
        
      - name: Test existing video URL (No Publish)
        env:
          FACEBOOK_TEST_VIDEO: 'true'
          FACEBOOK_STORY_NUMBER: '19'
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python minomasal_facebook_publish.py
