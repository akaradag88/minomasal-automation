
name: MinoMasal Facebook Connection Test (No Publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-facebook:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        with:
          python-version: '3.11'

      - name: Test Facebook connection
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python minomasal_facebook_publish.py
        
      - name: Test existing video URL (No Publish)
        env:
          FACEBOOK_TEST_VIDEO: 'true'
          FACEBOOK_STORY_NUMBER: '19'
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python minomasal_facebook_publish.py

        
      - name: Test Facebook duplicate protection (No Publish)
        env:
          FACEBOOK_TEST_LEDGER: 'true'
          FACEBOOK_STORY_NUMBER: '19'
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python minomasal_facebook_publish.py
        
      - name: Check Facebook Python syntax (No Publish)
        run: python -m py_compile minomasal_facebook_publish.py
