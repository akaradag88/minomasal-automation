name: MinoMasal 10.8 Ozel Gun Video Onizleme (NO PUBLISH)

on:
  workflow_dispatch:
    inputs:
      story_number:
        description: 'Onayli ozel gun hikayesi'
        required: true
        default: '45'
        type: choice
        options:
          - '45'
          - '46'

permissions:
  contents: read

concurrency:
  group: minomasal-special-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-preview:
    name: Generate MP4 for human review only
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        with:
          python-version: '3.11'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-minomasal.txt
      - name: Create isolated special-story preview (NO PUBLISH)
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINOMASAL_GEMINI_FREE_TIER_CONFIRMED: ${{ vars.MINOMASAL_GEMINI_FREE_TIER_CONFIRMED || 'false' }}
          MINOMASAL_YOUTUBE_UPLOAD: 'false'
          PUBLISH_ENABLED: 'false'
        run: python minomasal_45_46_onizleme.py --number '${{ inputs.story_number }}'
      - name: Save video, story, and images for human review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: minomasal-special-story-${{ inputs.story_number }}-preview
          path: minomasal_45_46_preview_output/
          retention-days: 7
          if-no-files-found: warn
