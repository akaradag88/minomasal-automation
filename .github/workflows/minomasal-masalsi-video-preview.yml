
name: MinoMasal Masalsi Video Preview (No Publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      MINOMASAL_YOUTUBE_UPLOAD: 'false'
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MINOMASAL_GEMINI_FREE_TIER_CONFIRMED: ${{ vars.MINOMASAL_GEMINI_FREE_TIER_CONFIRMED || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-minomasal.txt

     
      - name: Check preview safety
        run: |
          python -m py_compile minomasal.py
          python -m py_compile minomasal_masalsi_video_test.py
          python -m py_compile minomasal_masalsi_guvenli.py
          python -m py_compile minomasal_masalsi_oneri.py

          test "$MINOMASAL_YOUTUBE_UPLOAD" = "false"
          echo "Yayin modu KAPALI."

      - name: Generate masalsi video (No Publish)
        run: |
          python minomasal_masalsi_video_test.py

      - name: Save preview video
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: minomasal-masalsi-video-preview
          path: masalsi_video_onizleme.mp4
          if-no-files-found: error
          retention-days: 3
