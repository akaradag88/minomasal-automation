
name: MinoMasal Masalsi Video Preview (No Publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      MINOMASAL_YOUTUBE_UPLOAD: 'false'
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-minomasal.txt

     
      - name: Check preview safety
        run: |
          python -m py_compile minomasal.py
          python -m py_compile minomasal_masalsi_video_test.py
          python -m py_compile minomasal_masalsi_guvenli.py
          python -m py_compile minomasal_masalsi_oneri.py

          test "$MINOMASAL_YOUTUBE_UPLOAD" = "false"
          echo "Yayin modu KAPALI."

      - name: Generate masalsi video (No Publish)
        run: |
          python minomasal_masalsi_video_test.py

      - name: Save preview video
        uses: actions/upload-artifact@v4
        with:
          name: minomasal-masalsi-video-preview
          path: masalsi_video_onizleme.mp4
          if-no-files-found: error
          retention-days: 3
