
name: MinoMasal Hikaye Prompt Testi (No Publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare old and new prompts
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          topic = "Sincap ve Saklanan Oyuncak"
          key = os.environ["POLLINATIONS_API_KEY"]

          old_prompt = """4–8 yaş çocuklarına Türkçe öğretici hayvan hikâyesi yaz. Konu: {topic}.
          Toplam 100–130 kelime, 10 sahne. İlk cümle merak uyandırsın. Olaylar sebep-sonuç sırasıyla ilerlesin.
          Tek somut ders, korkutucu içerik yok, tehlikeli davranışa özendirme yok, satın alma/abone ol çağrısı yok.
          Son cümlede çocukla ilgili kısa düşünme sorusu sor.
          
         
          MASALSI ANLATIM:
          
          Karakterlerin konuşmaları doğal kalsın.
          Gereksiz açıklamalarla hikâyeyi uzatma.
          Tam 10 sahne ve toplam 100–130 kelime sınırını koru.
          Her sahnede ortalama 10–13 kelime kullan.


          Yalnız JSON döndür: {"title":"kısa Türkçe başlık","moral":"ders","characters":"tüm karakterlerin İngilizce sabit fiziksel tanımı",
          "scenes":[{"narration":"Türkçe 1–2 kısa cümle","visual":"bu anlatımdaki olayın İngilizce görsel açıklaması","sfx":"none"}]}.
          Karakter isimlerini ve görünüşlerini bütün sahnelerde koru. Görsel açıklamasında kadraj ve eylem belirt.
          """

          
          
          new_prompt = old_prompt



          def generate(prompt):
              payload = json.dumps({
                  "model": "openai",
                  "messages": [{
                      "role": "user",
                      "content": prompt.replace("{topic}", topic)
                  }],
                  "response_format": {"type": "json_object"}
              }).encode("utf-8")

              request = urllib.request.Request(
                  "https://gen.pollinations.ai/v1/chat/completions",
                  data=payload,
                  headers={
                      "Authorization": "Bearer " + key,
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(request, timeout=150) as response:
                  result = json.load(response)

              content = result["choices"][0]["message"]["content"]
              content = re.sub(
                  r"^```(?:json)?\s*|\s*```$",
                  "",
                  content.strip()
              )

              return json.loads(content)

          
          # Tek hikaye uret; eski ve yeni acilis icin ayni hikayeyi kullan.
          base_story = generate(old_prompt)
          
          # Masalsı anlatım denemesi: Hikâyeyi değiştirme.
          original_scenes = [
              scene["narration"]
              for scene in base_story["scenes"][:2]
          ]

          masal_prompt = (
              "Aşağıdaki iki çocuk masalı sahnesini "
              "doğal Türkçeyle, ağırlıklı olarak "
              "-miş'li geçmiş zamanla yeniden anlat. "
              "Olayları, karakterlerin duygularını ve "
              "anlamı kesinlikle değiştirme. "
              "Yeni olay veya karakter ekleme. "
              "Karakter konuşmalarını doğal bırak. "
              "Her sahnenin uzunluğunu yaklaşık koru. "
              'Yalnız JSON döndür: {"scenes":["metin1","metin2"]}\n'
              + json.dumps(original_scenes, ensure_ascii=False)
          )

          masal_result = generate(masal_prompt)
          masal_scenes = masal_result["scenes"]

          if len(masal_scenes) != 2:
              raise RuntimeError("İki sahne bekleniyordu.")

          print("MASALSI ANLATIM KARSILASTIRMASI")
          for i, (old, new) in enumerate(
              zip(original_scenes, masal_scenes), 1
          ):
              print(f"SAHNE {i} ESKI:", old)
              print(f"SAHNE {i} MASALSI:", new)


          for label, prompt in [
              ("ESKI PROMPT", old_prompt),
              ("YENI PROMPT", new_prompt)
          ]:
              story = json.loads(
                  json.dumps(base_story, ensure_ascii=False)
              )


              
              if label == "YENI PROMPT":
                  first = story["scenes"][0]["narration"].strip()

                  
                  match = re.match(r"^.*?[.!?](?=\s|$)", first)
                  if not match:
                      raise RuntimeError("İlk cümle belirlenemedi.")

                  opening_prompt = (
                      "Çocuk masalının yalnızca ilk cümlesini yeniden yaz. "
                      "En fazla 12 Türkçe kelime kullan. "
                      "Merak uyandırsın ve mevcut olay örgüsünü değiştirmesin. "
                      
                      "ORIJINAL HIKAYEYE SADIK KAL: "
                      "Karakterin duygusunu kesinlikle degistirme. "
                      "Seviniyorsa korkmus veya urkmus gibi anlatma. "
                      "Uzuluyorsa seviniyor gibi anlatma. "
                      "Hikayede bulunmayan olay, duygu veya tepki ekleme. "
                      "Merak uyandirmak icin gercegi carpitma. "
                      "Gerekirse kisa bir 'Peki neden?' sorusu kullan. "
                      "Yeni acilis, orijinal ilk sahnenin anlamini korusun. "

                      "Doğal, akıcı ve çocukların kolay anlayacağı Türkçe kullan. "
                      "Cansız oyuncakları kendiliğinden hareket eden veya karar veren "
                      "varlıklar gibi anlatma; hikâye bunu gerektirmiyorsa "
                      "eylemi gerçek karakterlere bağla. "
                      "Gereksiz tekrar, yapay ifade ve mantık hatası oluşturma. "
                      "İlk sahnenin görseliyle ve ikinci sahnenin olaylarıyla uyumlu ol. "
                      "Merak uyandırırken hikâyeye yeni olay ekleme. "
                      "'Bir gün', 'Güzel bir sabah', 'Bir zamanlar' ile başlama. "
                      "Yalnız JSON döndür: "
                      '{"opening":"yeni ilk cümle"}\n'
                      f"Hikâye konusu: {topic}\n"
                      f"İlk sahne: {first}\n"
                      f"İkinci sahne: {story['scenes'][1]['narration']}\n"
                      f"İlk sahnenin görseli: {story['scenes'][0]['visual']}\n"
                      "İlk cümle ikinci sahneye mantıklı biçimde bağlansın. "
                      "Oyuncak gibi cansız nesnelere kendi kendine hareket, "
                      "niyet veya duygu atfetme. "
                      "'Derken' ve 'sanki' kelimelerini kullanma. "
                      "Cümlenin öznesi açık olsun. "
                      "İlk sahnede henüz gerçekleşmeyen eylemleri anlatma. "
                      "İkinci sahnedeki hareketleri ilk sahneye taşıma. "
                      "Karakterin gördüğü nesne veya karşılaştığı sorun "
                      "hakkında kısa ve merak uyandıran bir soru sorabilirsin. "
                      "İlk sahne görselinde yalnızca bakıyorsa, "
                      "nesneyi aldığını veya taşıdığını söyleme. "
                      "Yeni açılış görselde gösterilebilen olayla sınırlı olsun. "
                      "Yalnızca görseldeki ve hikâyedeki gerçek olayı anlat. "

                  )

                  
                  opening = None

                  for attempt in range(3):
                      
                      result = generate(
                          opening_prompt
                          + f"\nBu {attempt + 1}. denemedir. "
                          "Yeni cümle doğrudan olayla başlasın. "
                          "İlk iki kelime kesinlikle 'Bir gün' olmasın. "
                          "Önceki cümleyi aynen tekrarlama. "
                          "En fazla 10 kelime kullan. "
                          "Hikâyeye yeni olay veya karakter ekleme. "
                          'Yalnız {"opening":"..."} JSON döndür.'
                      )


                      candidate = result.get("opening", "").strip()
                      word_count = len(candidate.split())

                      
                      forbidden = (
                          "bir gün",
                          "bir zamanlar",
                          "güzel bir sabah",
                          "evvel zaman",
                      )

                      valid_start = not candidate.casefold().startswith(
                          forbidden
                      )

                      if (
                          1 <= word_count <= 12
                          and candidate.endswith((".", "!", "?"))
                          and valid_start
                      ):

                          opening = candidate
                          break

                      
                      print(
                          f"Açılış denemesi {attempt + 1}: "
                          f"{word_count} kelime"
                      )
                      print("Üretilen cümle:", candidate)
                      print("Yasaklı başlangıç kontrolü:", valid_start)
                      print(
                          "Noktalama kontrolü:",
                          candidate.endswith((".", "!", "?"))
                      )


                  if opening is None:
                      raise RuntimeError(
                          "Üç denemede uygun açılış oluşturulamadı."
                      )


                  
                  # Yeni açılış, eski ilk sahnenin tamamının yerine geçer.
                  # Böylece tekrar eden anlatım eklenmez.
                  
                  # Yeni açılış yalnızca adaydır.
                  # Kalite onayı olmadan orijinal hikâyeyi değiştirme.
                  print("ORIJINAL ACILIS:", first)
                  print("ADAY ACILIS:", opening)
                  print("DURUM: Manuel kalite kontrolü bekleniyor.")



                  count = sum(
                      len(s["narration"].split())
                      for s in story["scenes"]
                  )

                  if not 100 <= count <= 130:
                      raise RuntimeError(
                          f"Hikâye uzunluğu uygun değil: {count}"
                      )


              scenes = story["scenes"]
              narration = " ".join(
                  scene["narration"] for scene in scenes
              )

              print("\n" + "=" * 40)
              print(label)
              print("Baslik:", story["title"])
              print("Ilk sahne:", scenes[0]["narration"])
              print("Toplam kelime:", len(narration.split()))
              print("Sahne sayisi:", len(scenes))
              print("Ders:", story["moral"])
              
              if label == "YENI PROMPT":
                  print("SAHNE 1 ANLATIM:", scenes[0]["narration"])
                  print("SAHNE 1 GORSEL:", scenes[0]["visual"])
                  print("SAHNE 2 ANLATIM:", scenes[1]["narration"])
                  print("SAHNE 2 GORSEL:", scenes[1]["visual"])


          print("\nTest tamamlandi. Video yayinlanmadi.")
          PY
