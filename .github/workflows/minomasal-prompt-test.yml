
name: MinoMasal Hikaye Prompt Testi (No Publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare old and new prompts
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          topic = "Sincap ve Saklanan Oyuncak"
          key = os.environ["POLLINATIONS_API_KEY"]

          old_prompt = """4–8 yaş çocuklarına Türkçe öğretici hayvan hikâyesi yaz. Konu: {topic}.
          Toplam 100–130 kelime, 10 sahne. İlk cümle merak uyandırsın. Olaylar sebep-sonuç sırasıyla ilerlesin.
          Tek somut ders, korkutucu içerik yok, tehlikeli davranışa özendirme yok, satın alma/abone ol çağrısı yok.
          Son cümlede çocukla ilgili kısa düşünme sorusu sor.
          Yalnız JSON döndür: {"title":"kısa Türkçe başlık","moral":"ders","characters":"tüm karakterlerin İngilizce sabit fiziksel tanımı",
          "scenes":[{"narration":"Türkçe 1–2 kısa cümle","visual":"bu anlatımdaki olayın İngilizce görsel açıklaması","sfx":"none"}]}.
          Karakter isimlerini ve görünüşlerini bütün sahnelerde koru. Görsel açıklamasında kadraj ve eylem belirt.
          """

          
          
          new_prompt = old_prompt



          def generate(prompt):
              payload = json.dumps({
                  "model": "openai",
                  "messages": [{
                      "role": "user",
                      "content": prompt.replace("{topic}", topic)
                  }],
                  "response_format": {"type": "json_object"}
              }).encode("utf-8")

              request = urllib.request.Request(
                  "https://gen.pollinations.ai/v1/chat/completions",
                  data=payload,
                  headers={
                      "Authorization": "Bearer " + key,
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(request, timeout=150) as response:
                  result = json.load(response)

              content = result["choices"][0]["message"]["content"]
              content = re.sub(
                  r"^```(?:json)?\s*|\s*```$",
                  "",
                  content.strip()
              )

              return json.loads(content)

          
          # Tek hikaye uret; eski ve yeni acilis icin ayni hikayeyi kullan.
          base_story = generate(old_prompt)

          for label, prompt in [
              ("ESKI PROMPT", old_prompt),
              ("YENI PROMPT", new_prompt)
          ]:
              story = json.loads(
                  json.dumps(base_story, ensure_ascii=False)
              )


              
              if label == "YENI PROMPT":
                  first = story["scenes"][0]["narration"].strip()

                  
                  match = re.match(r"^.*?[.!?](?=\s|$)", first)
                  if not match:
                      raise RuntimeError("İlk cümle belirlenemedi.")

                  opening_prompt = (
                      "Çocuk masalının yalnızca ilk cümlesini yeniden yaz. "
                      "En fazla 12 Türkçe kelime kullan. "
                      "Merak uyandırsın ve mevcut olay örgüsünü değiştirmesin. "
                      "'Bir gün', 'Güzel bir sabah', 'Bir zamanlar' ile başlama. "
                      "Yalnız JSON döndür: "
                      '{"opening":"yeni ilk cümle"}\n'
                      f"Hikâye konusu: {topic}\n"
                      f"İlk sahne: {first}"
                  )

                  
                  opening = None

                  for attempt in range(3):
                      result = generate(
                          opening_prompt
                          + "\nZORUNLU: En fazla 10 kelimelik "
                            "tek bir cümle yaz. "
                            "Yalnız JSON döndür."
                      )

                      candidate = result.get("opening", "").strip()
                      word_count = len(candidate.split())

                      
                      forbidden = (
                          "bir gün",
                          "bir zamanlar",
                          "güzel bir sabah",
                          "evvel zaman",
                      )

                      valid_start = not candidate.casefold().startswith(
                          forbidden
                      )

                      if (
                          1 <= word_count <= 12
                          and candidate.endswith((".", "!", "?"))
                          and valid_start
                      ):

                          opening = candidate
                          break

                      print(
                          f"Açılış denemesi {attempt + 1}: "
                          f"{word_count} kelime, uygun değil."
                      )

                  if opening is None:
                      raise RuntimeError(
                          "Üç denemede uygun açılış oluşturulamadı."
                      )


                  remainder = first[match.end():].strip()
                  story["scenes"][0]["narration"] = (
                      opening + (" " + remainder if remainder else "")
                  )

                  count = sum(
                      len(s["narration"].split())
                      for s in story["scenes"]
                  )

                  if not 100 <= count <= 130:
                      raise RuntimeError(
                          f"Hikâye uzunluğu uygun değil: {count}"
                      )


              scenes = story["scenes"]
              narration = " ".join(
                  scene["narration"] for scene in scenes
              )

              print("\n" + "=" * 40)
              print(label)
              print("Baslik:", story["title"])
              print("Ilk sahne:", scenes[0]["narration"])
              print("Toplam kelime:", len(narration.split()))
              print("Sahne sayisi:", len(scenes))
              print("Ders:", story["moral"])

          print("\nTest tamamlandi. Video yayinlanmadi.")
          PY
