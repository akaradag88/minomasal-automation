
name: MinoMasal Ozel Gun Testi (No Publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)

      - name: Check special day stories
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("minomasal.py").read_text(encoding="utf-8")
          tree = ast.parse(source)

          assignments = {
              target.id: node.value
              for node in ast.walk(tree)
              if isinstance(node, ast.Assign)
              for target in node.targets
              if isinstance(target, ast.Name)
          }

          topics = ast.literal_eval(assignments["KONULAR"])
          special = ast.literal_eval(assignments["ozel_gunler"])

          expected = {
              33: "Minik Sincabın Kırmızı Beyaz Bayrağı",
              34: "Orman Okulunda Cumhuriyet Coşkusu",
              45: "Küçük Baykuş Atatürk'ü Öğreniyor",
              46: "Orman Okulunda Atatürk'ü Anma Günü",
          }

          rules = Path(
              "minomasal_ozel_gun_kurallari.txt"
          ).read_text(encoding="utf-8")

          republic = "29 EKİM CUMHURİYET BAYRAMI:"
          memorial = "10 KASIM ATATÜRK'Ü ANMA GÜNÜ:"
          common = "ORTAK KURALLAR:"

          assert rules.index(republic) < rules.index(memorial)
          assert rules.index(memorial) < rules.index(common)

          assert "29 Ekim 1923" in rules
          assert "10 Kasım 1938" in rules
          assert len(special) == 4

          for number, topic in expected.items():
              assert topics[number - 1] == topic, (
                  f"Video {number}: konu sirasi yanlis"
              )

              heading = republic if number in (33, 34) else memorial
              assert special[topic] == heading, (
                  f"Video {number}: yanlis ozel gun kurali"
              )

              end = memorial if number in (33, 34) else common
              selected = rules.split(heading, 1)[1].split(end, 1)[0]

              assert selected.strip()
              assert rules.split(common, 1)[1].strip()

              print(f"Video {number}: konu ve kurallar DOGRU")

          assert any(
              isinstance(node, ast.AugAssign)
              and isinstance(node.target, ast.Name)
              and node.target.id == "prompt"
              for node in ast.walk(tree)
          ), "Prompt ekleme islemi bulunamadi"

          print("TEST BASARILI. Video uretilmedi veya yayinlanmadi.")
          PY

        
      - name: Verify actual special day prompts (No API)
        run: |
          python - <<'PY'
          import ast
          import json
          import re
          from pathlib import Path

          source = Path("minomasal.py").read_text(encoding="utf-8")
          tree = ast.parse(source)

          function = next(
              node for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name == "create_story"
          )

          captured = []

          class FakeResponse:
              status_code = 200

              def json(self):
                  return {
                      "choices": [{
                          "message": {
                              "content": json.dumps({
                                  "title": "Test",
                                  "characters": "Test character",
                                  "scenes": []
                              })
                          }
                      }]
                  }

          class FakeRequests:
              @staticmethod
              def post(url, headers, json, timeout):
                  captured.append(json["messages"][0]["content"])
                  return FakeResponse()

          namespace = {
              "Path": Path,
              "json": json,
              "re": re,
              "requests": FakeRequests,
              "validate": lambda story: story,
              "__file__": str(Path("minomasal.py").resolve())
          }

          module = ast.Module(body=[function], type_ignores=[])
          exec(compile(module, "dry_run", "exec"), namespace)

          cases = {
              "Minik Sincabın Kırmızı Beyaz Bayrağı": "29 Ekim 1923",
              "Orman Okulunda Cumhuriyet Coşkusu": "29 Ekim 1923",
              "Küçük Baykuş Atatürk'ü Öğreniyor": "10 Kasım 1938",
              "Orman Okulunda Atatürk'ü Anma Günü": "10 Kasım 1938"
          }

          for topic, expected in cases.items():
              namespace["create_story"](topic, "TEST_KEY", "openai")
              prompt = captured[-1]

              assert expected in prompt, topic
              assert "ORTAK KURALLAR:" in prompt, topic

              print("DOGRU:", topic)

          namespace["create_story"](
              "Yuva Yapmayı Öğrenen Serçe", "TEST_KEY", "openai"
          )

          assert "BU HİKÂYEYE ÖZEL ZORUNLU KURALLAR" not in captured[-1]

          print("Normal hikaye etkilenmiyor.")
          print("TEST BASARILI - API cagrilmadi, video yayinlanmadi.")
          PY

          
      - name: Generate special day story previews (No Publish)
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          python -m pip install requests

          python - <<'PY'
          import ast
          import json
          import os
          import re
          from pathlib import Path
          import requests

          source = Path("minomasal.py")
          tree = ast.parse(source.read_text(encoding="utf-8"))

          functions = [
              node for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name in ("validate", "create_story")
          ]

          namespace = {
              "Path": Path,
              "json": json,
              "re": re,
              "requests": requests,
              "__file__": str(source.resolve()),
          }

          exec(
              compile(
                  ast.Module(body=functions, type_ignores=[]),
                  "minomasal_preview",
                  "exec"
              ),
              namespace
          )

          topics = [
              "Minik Sincabın Kırmızı Beyaz Bayrağı",
              "Orman Okulunda Cumhuriyet Coşkusu",
              "Küçük Baykuş Atatürk'ü Öğreniyor",
              "Orman Okulunda Atatürk'ü Anma Günü",
          ]

          preview_dir = Path("ozel_gun_onizleme")
          preview_dir.mkdir(exist_ok=True)

          for topic in topics:
              story = namespace["create_story"](
                  topic,
                  os.environ["POLLINATIONS_API_KEY"],
                  "openai"
              )

              preview_file = preview_dir / (
                  f"hikaye_{topics.index(topic) + 1:02d}.json"
              )

              preview_file.write_text(
                  json.dumps(story, ensure_ascii=False, indent=2),
                  encoding="utf-8"
              )

              scenes = story["scenes"]
              narration = " ".join(
                  scene["narration"] for scene in scenes
              )
              words = len(narration.split())

              print("\n" + "=" * 50)
              print("KONU:", topic)
              print("BASLIK:", story["title"])
              print("KELIME:", words)
              print("SAHNE:", len(scenes))
              print("DERS:", story["moral"])

              for i, scene in enumerate(scenes, 1):
                  print(f"{i}. {scene['narration']}")

              if len(scenes) != 10 or not 100 <= words <= 130:
                  print("UYARI: Uzunluk veya sahne hedefi tutmadi.")

          print("\nON IZLEME TAMAMLANDI - VIDEO YAYINLANMADI.")
          PY

      - name: Save special day story JSON files
        uses: actions/upload-artifact@v4
        with:
          name: minomasal-ozel-gun-hikayeleri
          path: ozel_gun_onizleme/*.json
          if-no-files-found: error
          retention-days: 7


      - name: Verify approved story routing (No Publish)
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          daily = ast.parse(
              Path("minomasal_daily_live.py").read_text(encoding="utf-8")
          )
          main_code = ast.parse(
              Path("minomasal.py").read_text(encoding="utf-8")
          )

          def assignment(tree, name):
              for node in ast.walk(tree):
                  if isinstance(node, ast.Assign):
                      if any(
                          isinstance(t, ast.Name) and t.id == name
                          for t in node.targets
                      ):
                          return ast.literal_eval(node.value)
              raise RuntimeError(f"Degisken bulunamadi: {name}")

          mapping = assignment(daily, "onayli_hikayeler")
          topics = assignment(main_code, "KONULAR")

          expected = {
              33: "hikaye_01.json",
              34: "hikaye_02.json",
              45: "hikaye_03.json",
              46: "hikaye_04.json",
          }

          assert set(mapping) == set(expected)

          for number, filename in expected.items():
              topic, selected_file = mapping[number]

              assert selected_file == filename
              assert topics[number - 1] == topic

              story = json.loads(
                  Path(filename).read_text(encoding="utf-8")
              )

              assert story.get("title")
              assert story.get("characters")
              assert len(story.get("scenes", [])) == 10

              for scene in story["scenes"]:
                  assert scene.get("narration")
                  assert scene.get("visual")

              words = sum(
                  len(scene["narration"].split())
                  for scene in story["scenes"]
              )

              assert 100 <= words <= 130, (
                  f"Video {number}: {words} kelime"
              )

              print(
                  f"Video {number}: ONAYLI JSON DOGRU - "
                  f"{words} kelime"
              )

          assert any(
              isinstance(node, ast.Call)
              and isinstance(node.func, ast.Name)
              and node.func.id == "produce"
              and any(
                  kw.arg == "supplied_story"
                  for kw in node.keywords
              )
              for node in ast.walk(daily)
          ), "Onayli hikaye produce baglantisi eksik"

          print("TEST BASARILI - YAYIN YAPILMADI.")
          PY

