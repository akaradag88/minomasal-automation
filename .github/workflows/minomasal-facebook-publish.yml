
name: MinoMasal Facebook Publish

on:
  
  workflow_dispatch:
    inputs:
      story_number:
        description: "Facebook'a gönderilecek hikâye numarası"
        required: true
        default: "19"
        type: string
      confirm_publish:
        description: "Gerçek Facebook yayını için YES yazın"
        required: true
        default: "NO"
        type: string


permissions:
  contents: write

concurrency:
  group: minomasal-facebook-publish
  cancel-in-progress: false

jobs:
  facebook:
    runs-on: ubuntu-24.04

    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        with:
          python-version: '3.11'

      - name: Check Facebook Python syntax
        run: python -m py_compile minomasal_facebook_publish.py



      - name: Verify Facebook publication confirmation
        env:
          STORY_NUMBER: ${{ inputs.story_number }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          if [ "$STORY_NUMBER" != "19" ]; then
            echo "İlk Facebook yayını yalnızca 19. video için."
            exit 1
          fi

          if [ "$CONFIRM_PUBLISH" = "YES" ]; then
            echo "UYARI: Gerçek Facebook Reels yayınına izin verildi."
          elif [ "$CONFIRM_PUBLISH" = "NO" ]; then
            echo "Facebook yayını kapalı. Yalnızca test yapılacak."
          else
            echo "Geçersiz yayın onayı."
            exit 1
          fi


      - name: Validate Facebook publication request (No Publish)
        env:
          STORY_NUMBER: ${{ inputs.story_number }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          python - <<'PY'
          import os
          import json
          from pathlib import Path

          number = os.environ["STORY_NUMBER"]
          confirmation = os.environ["CONFIRM_PUBLISH"]

          if number != "19":
              raise RuntimeError("İlk Facebook testi yalnızca 19. video için.")

          if confirmation not in ("YES", "NO"):
              raise RuntimeError("Geçersiz yayın onayı.")

          ledger = json.loads(
              Path("minomasal_facebook_durumu.json").read_text(encoding="utf-8")
          )

          if str(number) in ledger.get("stories", {}):
              raise RuntimeError("Facebook yayın kaydı mevcut; tekrar deneme yasak.")

          print("Facebook yayın öncesi güvenlik kontrolü başarılı.")
          print("Henüz Facebook'a video gönderilmedi.")
          PY


      - name: Test Facebook ledger GitHub access (No Publish)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("minomasal_facebook_durumu.json")
          ledger = json.loads(path.read_text(encoding="utf-8"))

          assert ledger["schema_version"] == 1
          assert isinstance(ledger["stories"], dict)

          print("Facebook kayıt dosyası geçerli.")
          PY

          git ls-remote --exit-code origin refs/heads/main > /dev/null
          echo "GitHub depo bağlantısı başarılı."

      - name: Test Facebook ledger write permissions (No Publish)
        run: |
          git rev-parse --show-toplevel
          test "$(git config --get user.name)" = "github-actions[bot]"
          git push --dry-run origin HEAD:main
          echo "GitHub yazma yetkisi ön kontrolü başarılı."
          
      - name: Publish first Facebook Reel
        if: ${{ inputs.story_number == '19' && inputs.confirm_publish == 'YES' }}
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PUBLISH_ENABLED: "true"
          FACEBOOK_CONFIRM_PUBLISH: "YES"
        run: |
          python - <<'PY'
          from minomasal_facebook_publish import complete_first_facebook_reel
          complete_first_facebook_reel(19)
          PY

