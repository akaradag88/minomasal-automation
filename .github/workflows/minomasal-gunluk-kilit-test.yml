name: MinoMasal Gunluk Kilit Unit Test (NO PUBLISH)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline safety tests (11 cases)
        run: python -m unittest -v test_minomasal_gunluk_kilit.py
      - name: Read-only repository preflight
        env:
          MINOMASAL_LOCK_TOKEN: ${{ github.token }}
          MINOMASAL_LOCK_START_DATE: '2026-11-04'
        run: python minomasal_gunluk_kilit.py preflight
      - name: Confirm test has no publication steps
        run: |
          echo 'TEST TAMAMLANDI. Kilit olusturulmadi; video uretilmedi; yayin yapilmadi.'
