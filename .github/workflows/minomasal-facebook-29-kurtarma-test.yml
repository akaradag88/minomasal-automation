
name: MinoMasal Facebook 29 Recovery Safety Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check recovery safety (No Publish)
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          script = Path("minomasal_facebook_29_kurtarma.py")
          source = script.read_text(encoding="utf-8")
          tree = ast.parse(source)

          ledger = json.loads(
              Path("minomasal_facebook_durumu.json")
              .read_text(encoding="utf-8")
          )

          record = ledger["stories"]["29"]

          assert record["status"] == "ambiguous"
          assert str(record["video_id"]) == "1453876890009815"
          assert record["upload_complete"] is True
          assert record["finish_attempted"] is True
          assert record.get("post_id") is None
          assert not record.get("recovery_attempted")

          print("TEST 1: Facebook 29 kaydi DOGRU")

          assignments = {
              target.id: node.value
              for node in ast.walk(tree)
              if isinstance(node, ast.Assign)
              for target in node.targets
              if isinstance(target, ast.Name)
          }

          assert ast.literal_eval(
              assignments["VIDEO_ID"]
          ) == "1453876890009815"

          assert ast.literal_eval(
              assignments["NUMBER"]
          ) == "29"

          print("TEST 2: Kurtarma video kimligi DOGRU")

          main = next(
              node for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name == "main"
          )

          calls = sorted(
              (
                  node.lineno,
                  node.func.id
              )
              for node in ast.walk(main)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Name)
              and node.func.id in (
                  "save_facebook_ledger",
                  "facebook_reels_finish",
              )
          )

          names = [name for _, name in calls]

          assert names.count("facebook_reels_finish") == 1
          assert names[0] == "save_facebook_ledger"

          print("TEST 3: Once GitHub kaydi, sonra yayin DOGRU")
          print("TEST BASARILI - FACEBOOK'A ISTEK GONDERILMEDI")
          PY
