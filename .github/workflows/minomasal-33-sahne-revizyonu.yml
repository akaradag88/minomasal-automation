name: MinoMasal 33 - 5 Sahne Gorsel Revizyon (NO PUBLISH)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: minomasal-33-gorsel-revizyon
  cancel-in-progress: false

jobs:
  revise-visuals-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        with:
          python-version: '3.11'

      - name: Install dependencies and verified FFmpeg
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET="ffmpeg-master-latest-linux64-gpl.tar.xz"
          REPO="BtbN/FFmpeg-Builds"
          gh release download latest --repo "$REPO" --pattern "$ASSET" --pattern "checksums.sha256" --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          grep -F "$ASSET" checksums.sha256 | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$ASSET" -C "$RUNNER_TEMP/ffmpeg"
          FFMPEG_BIN="$(find "$RUNNER_TEMP/ffmpeg" -type f -name ffmpeg -print -quit)"
          test -n "$FFMPEG_BIN"
          BIN_DIR="$(dirname "$FFMPEG_BIN")"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$BIN_DIR:$PATH"
          ffmpeg -version
          ffprobe -version
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "Pillow>=10,<12" "requests>=2.31,<3"

      - name: Download successful original preview artifact (read only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list -R "$GITHUB_REPOSITORY" --workflow minomasal-33-ozel-gun-onizleme.yml --status success -L 20 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Onaylı 33. hikâyenin başarılı önizleme çalışması bulunamadı."
            exit 1
          fi
          echo "Orijinal artifact çalışma ID: $RUN_ID"
          mkdir -p original
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n minomasal-33-29ekim-yayinsiz-onizleme -D original
          test -s original/masal_33_onizleme.mp4
          test -s original/altyazi_33.srt
          test -s original/hikaye_33_onayli.json
          echo "Orijinal video ve eşzamanlı altyazılar alındı."

      - name: Generate corrected scene visuals and keep old audio
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          MINOMASAL_YOUTUBE_UPLOAD: 'false'
        run: python minomasal_33_sahne_revizyonu.py --source original

      - name: Save corrected MP4 and scene inspection images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: minomasal-33-8-8-revize-yayinsiz
          path: |
            minomasal_33_revize/masal_33_revize_yayinsiz.mp4
            minomasal_33_revize/5_sahne_kontrol.jpg
            minomasal_33_revize/duzeltilen_sahneler/*.jpg
            minomasal_33_revize/hikaye_33_onayli.json
            minomasal_33_revize/altyazi_33_orijinal.srt
          retention-days: 7
          if-no-files-found: warn
