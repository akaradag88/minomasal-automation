
name: MinoMasal Facebook Daily


on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:
    inputs:
      story_number:
        description: "Facebook'ta yayinlanacak video numarasi"
        required: true
        default: "21"
        type: string
      confirm_publish:
        description: "Gercek yayin icin YES yazin"
        required: true
        default: "NO"
        type: string


permissions:
  contents: write

concurrency:
  group: minomasal-facebook-publish
  cancel-in-progress: false

jobs:
  publish-facebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: |
          python -m py_compile minomasal_facebook_publish.py
          python -m py_compile minomasal_facebook_daily.py

      - name: Refresh publication records
        run: |
          git fetch origin main
          git diff --quiet
          git diff --cached --quiet
          git reset --hard origin/main
          
      - name: Determine Facebook story and authorization
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_NUMBER: ${{ inputs.story_number }}
          INPUT_CONFIRM: ${{ inputs.confirm_publish }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            NUMBER=$(python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path("minomasal_platform_durumu.json").read_text(encoding="utf-8"))
          facebook = json.loads(Path("minomasal_facebook_durumu.json").read_text(encoding="utf-8"))

          published = [
              int(n) for n, record in source["stories"].items()
              if int(n) >= 21
              and record["youtube"]["status"] == "published"
              and record["instagram"]["status"] == "published"
          ]

          eligible = sorted(
              n for n in published
              if str(n) not in facebook["stories"]
          )

          print(eligible[0] if eligible else "")
          PY
            )

            if [ -z "$NUMBER" ]; then
              echo "No eligible Facebook story."
              exit 0
            fi

          else
            NUMBER="$INPUT_NUMBER"

            if [ "$INPUT_CONFIRM" != "YES" ]; then
              echo "Manual publication not authorized."
              exit 1
            fi
          fi

          if [[ ! "$NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid story number."
            exit 1
          fi

          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"


    

     
      - name: Publish Facebook Reel
        if: ${{ steps.selection.outputs.number != '' }}
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PUBLISH_ENABLED: 'true'
          FACEBOOK_CONFIRM_PUBLISH: 'YES'
          STORY_NUMBER: ${{ steps.selection.outputs.number }}
        run: |
          python minomasal_facebook_daily.py --number "$STORY_NUMBER"
