
name: MinoMasal Masalsi Guvenlik Testi (No Publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)

      - name: Test safe fallback
        run: |
          python - <<'PY'
          from minomasal_masalsi_kontrol import select_narrations

          original = [
              "Küçük fil ormanda arkadaşına yardım etti. "
              "Sonra birlikte güvenli bir yere gittiler."
          ] * 9 + [
              "Küçük fil çok sevindi. "
              "Sen bugün kime yardım edersin?"
          ]

          converted = [
              "Küçük fil ormanda arkadaşına yardım etmiş. "
              "Sonra birlikte güvenli bir yere gitmişler."
          ] * 9 + [
              "Küçük fil çok sevinmiş. "
              "Sen bugün kime yardım edersin?"
          ]

          # 1. Varsayılan: Onay yoksa orijinali koru.
          assert select_narrations(
              original, converted
          ) == original
          print("TEST 1: Onaysiz donusum reddedildi.")

          # 2. Onaylı ve geçerli dönüşüm kabul edilmeli.
          assert select_narrations(
              original, converted, approved=True
          ) == converted
          print("TEST 2: Gecerli donusum kabul edildi.")

          # 3. Eksik sahneli dönüşüm reddedilmeli.
          assert select_narrations(
              original, converted[:9], approved=True
          ) == original
          print("TEST 3: Eksik sahne reddedildi.")

          # 4. Son soruyu değiştiren dönüşüm reddedilmeli.
          wrong = converted.copy()
          wrong[-1] = (
              "Küçük fil çok sevinmiş. "
              "Bugün ne öğrendin?"
          )

          assert select_narrations(
              original, wrong, approved=True
          ) == original
          print("TEST 4: Degisen son soru reddedildi.")

          print("TUM TESTLER BASARILI - YAYIN YAPILMADI.")
          PY

      - name: Test masalsi application with real story (No Publish)
        run: |
          python - <<'PY'
          import json
          from copy import deepcopy
          from pathlib import Path
          from minomasal_masalsi_uygula import apply_masalsi

          story = json.loads(
              Path("hikaye_01.json").read_text(encoding="utf-8")
          )
          original = deepcopy(story)

          converted = [
              scene["narration"]
              for scene in story["scenes"]
          ]

          # Yalnızca test için geçici bir metin farkı oluştur.
          converted[0] = "Masalsı deneme: " + converted[0]

          # Onaysız dönüşüm orijinali korumalı.
          rejected = apply_masalsi(
              story, converted, approved=False
          )
          assert rejected == original
          print("TEST 1: Onaysiz hikaye korunuyor.")

          # Onaylı dönüşüm anlatıma uygulanmalı.
          accepted = apply_masalsi(
              story, converted, approved=True
          )
          assert accepted["scenes"][0]["narration"] == converted[0]
          print("TEST 2: Onayli anlatim uygulandi.")

          # Görseller ve karakter tanımları değişmemeli.
          assert accepted["characters"] == original["characters"]

          for old, new in zip(
              original["scenes"], accepted["scenes"]
          ):
              assert old["visual"] == new["visual"]

          print("TEST 3: Gorseller ve karakterler korundu.")

          # Kaynak hikaye değiştirilmemeli.
          assert story == original
          print("TEST 4: Orijinal JSON degismedi.")

          print("TUM TESTLER BASARILI - VIDEO YAYINLANMADI.")
          PY

      - name: Test masalsi AI module (No API, No Publish)
        run: |
          python -m pip install requests

          python - <<'PY'
          import json
          from copy import deepcopy
          from pathlib import Path
          from unittest.mock import patch
          import requests

          from minomasal_masalsi_oneri import create_masalsi_candidate
          from minomasal_masalsi_uygula import apply_masalsi

          story = json.loads(
              Path("hikaye_01.json").read_text(encoding="utf-8")
          )
          original = deepcopy(story)
          narrations = [
              s["narration"] for s in story["scenes"]
          ]
          
          print("SON SAHNE:", repr(narrations[-1]))
          print("SON KARAKTER:", repr(narrations[-1][-1]))


          class FakeResponse:
              def raise_for_status(self):
                  pass

              def json(self):
                  return {
                      "choices": [{
                          "message": {
                              "content": json.dumps({
                                  "scenes": narrations
                              }, ensure_ascii=False)
                          }
                      }]
                  }

          # API yanıtını taklit et. Gerçek API kullanılmaz.
          with patch(
              "minomasal_masalsi_oneri.requests.post",
              return_value=FakeResponse()
          ):
              candidate = create_masalsi_candidate(
                  story, "TEST_KEY"
              )

          assert len(candidate) == 10
          assert story == original
          print("TEST 1: Aday metin olusturuldu.")

          rejected = apply_masalsi(
              story, candidate, approved=False
          )
          assert rejected == original
          print("TEST 2: Onaysiz aday uygulanmadi.")

          # API hatasını taklit et.
          with patch(
              "minomasal_masalsi_oneri.requests.post",
              side_effect=requests.RequestException(
                  "Simulated API failure"
              )
          ):
              try:
                  create_masalsi_candidate(
                      story, "TEST_KEY"
                  )
              except requests.RequestException:
                  print("TEST 3: API hatasi yakalandi.")
              else:
                  raise AssertionError(
                      "API hatasi yakalanmadi."
                  )

          assert story == original
          print("TEST 4: Orijinal hikaye korundu.")
          print("TUM TESTLER BASARILI - YAYIN YAPILMADI.")
          PY

      - name: Test automatic masalsi fallback (No API, No Publish)
        run: |
          python - <<'PY'
          import json
          from copy import deepcopy
          from pathlib import Path
          from unittest.mock import patch

          from minomasal_masalsi_guvenli import prepare_masalsi_safely

          story = json.loads(
              Path("hikaye_01.json").read_text(encoding="utf-8")
          )
          original = deepcopy(story)

          candidate = [
              scene["narration"]
              for scene in story["scenes"]
          ]

          # TEST 1: AI basarili yanit veriyor.
          with patch(
              "minomasal_masalsi_guvenli.create_masalsi_candidate",
              return_value=candidate
          ):
              result, suggestion = prepare_masalsi_safely(
                  story, "TEST_KEY"
              )

          assert result == original
          assert suggestion == candidate
          assert result is not story
          print("TEST 1: Basarili aday olusturuldu.")

          # TEST 2: AI hata veriyor.
          with patch(
              "minomasal_masalsi_guvenli.create_masalsi_candidate",
              side_effect=RuntimeError("Test API hatasi")
          ):
              result, suggestion = prepare_masalsi_safely(
                  story, "TEST_KEY"
              )

          assert result == original
          assert suggestion is None
          print("TEST 2: AI hatasinda orijinal korundu.")

          # TEST 3: Kaynak hikaye degismedi.
          assert story == original
          print("TEST 3: Kaynak JSON degismedi.")

          print("TUM TESTLER BASARILI - YAYIN YAPILMADI.")
          PY

      - name: Real masalsi narration preview (No Publish)
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from minomasal_masalsi_guvenli import prepare_masalsi_safely

          story = json.loads(
              Path("hikaye_01.json").read_text(encoding="utf-8")
          )

          
          # Yalnızca bellekteki test kopyasını değiştir.
          # GitHub'daki onaylı JSON dosyasına dokunma.
          replacements = [
              (0, "bayrak görmüş.", "bayrak gördü."),
              (1, "yanına gelmiş.", "yanına geldi."),
          ]

          for index, old, new in replacements:
              narration = story["scenes"][index]["narration"]
              if old not in narration:
                  raise RuntimeError(
                      f"Test sahnesinde beklenen ifade bulunamadi: {old}"
                  )
              story["scenes"][index]["narration"] = narration.replace(
                  old, new, 1
              )

          print("TEST GIRISI: Ilk iki sahne -di'li gecmis zamana cevrildi.")


          original, candidate = prepare_masalsi_safely(
              story,
              os.environ["POLLINATIONS_API_KEY"]
          )

          if candidate is None:
              print("Masalsi donusum basarisiz. Orijinal korundu.")
              raise SystemExit(1)

          # Gercek zaman kipi donusumlerini dogrula.
          assert "bayrak gördü." in story["scenes"][0]["narration"]
          assert "bayrak görmüş." in candidate[0]

          assert "yanına geldi." in story["scenes"][1]["narration"]
          assert "yanına gelmiş." in candidate[1]

          assert len(candidate) == 10

          print("ZAMAN KIPI DONUSUM TESTI BASARILI")

          from copy import deepcopy
          from minomasal_masalsi_uygula import apply_masalsi

          original_story = deepcopy(story)

          # Gercek AI adayini yalnizca testte uygula.
          approved_preview = apply_masalsi(
              story, candidate, approved=True
          )

          assert story == original_story
          assert len(approved_preview["scenes"]) == 10

          for index in range(10):
              assert (
                  approved_preview["scenes"][index]["narration"]
                  == candidate[index]
              )
              assert (
                  approved_preview["scenes"][index]["visual"]
                  == story["scenes"][index]["visual"]
              )

          print("GERCEK AI ADAYI GUVENLI UYGULAMA TESTI BASARILI")
          print("ORIJINAL HIKAYE VE GORSELLER KORUNDU")

          from pathlib import Path
          import json

          # Yalnizca test amacli karsilastirma dosyasi.
          # Onayli ozel gun JSON dosyalarini degistirme.
          output = Path("masalsi_test_sonucu.json")

          output.write_text(
              json.dumps(
                  {
                      "status": "TEST_ONLY_NOT_APPROVED",
                      "original": original_story,
                      "masalsi_candidate": approved_preview
                  },
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("MASALSI TEST JSON DOSYASI HAZIR")

          print("MASALSI ANLATIM ON IZLEME")

          for i, (scene, text) in enumerate(
              zip(original["scenes"], candidate), 1
          ):
              print(f"\nSAHNE {i}")
              print("ESKI:", scene["narration"])
              print("MASALSI:", text)

          print("\nMANUEL KALITE ONAYI BEKLENIYOR.")
          print("VIDEO YAYINLANMADI.")
          PY

      - name: Save masalsi comparison JSON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: minomasal-masalsi-karsilastirma
          path: masalsi_test_sonucu.json
          if-no-files-found: error
          retention-days: 7

      - name: Test masalsi render bridge (No Publish)
        run: |
          python - <<'PY'
          import json
          from copy import deepcopy
          from pathlib import Path
          from minomasal_masalsi_kopru import prepare_story_for_render

          story = json.loads(
              Path("hikaye_01.json").read_text(encoding="utf-8")
          )
          original = deepcopy(story)

          candidate = [
              scene["narration"]
              for scene in story["scenes"]
          ]

          assert "görmüş." in candidate[0]
          candidate[0] = candidate[0].replace(
              "görmüş.", "gördü.", 1
          )

          # TEST 1: Onayli ozel gun hikayesi degismemeli.
          result = prepare_story_for_render(
              story,
              supplied_story=True,
              approved_candidate=candidate
          )
          assert result == original
          print("TEST 1: Ozel gun hikayesi korundu.")

          # TEST 2: Aday yoksa orijinali kullan.
          result = prepare_story_for_render(story)
          assert result == original
          print("TEST 2: Onaysiz hikaye korundu.")

          # TEST 3: Acikca verilen aday uygulansin.
          result = prepare_story_for_render(
              story,
              supplied_story=False,
              approved_candidate=candidate
          )
          assert result["scenes"][0]["narration"] == candidate[0]
          assert result["scenes"][0]["visual"] == original["scenes"][0]["visual"]
          print("TEST 3: Aday anlatim uygulandi.")

          # TEST 4: Gecersiz aday orijinale donsun.
          result = prepare_story_for_render(
              story,
              approved_candidate=candidate[:9]
          )
          assert result == original
          print("TEST 4: Gecersiz aday reddedildi.")

          assert story == original
          print("TEST 5: Kaynak JSON degismedi.")
          print("TUM TESTLER BASARILI - YAYIN YAPILMADI.")
          PY

      - name: Verify production bridge integration (No Publish)
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          source = Path("minomasal.py").read_text(encoding="utf-8")
          tree = ast.parse(source)

          produce = next(
              node for node in tree.body
              if isinstance(node, ast.AsyncFunctionDef)
              and node.name == "produce"
          )

          # Kodda köprü bağlantısı gerçekten var mı?
          calls = [
              node for node in ast.walk(produce)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Name)
              and node.func.id == "prepare_story_for_render"
          ]

          assert len(calls) == 1, "Kopru baglantisi eksik veya tekrarlanmis."

          call = calls[0]

          # Onaylı aday otomatik verilmemeli.
          assert not any(
              kw.arg == "approved_candidate"
              for kw in call.keywords
          ), "Otomatik masalsi onayi tespit edildi."

          from minomasal_masalsi_kopru import prepare_story_for_render

          story = json.loads(
              Path("hikaye_01.json").read_text(encoding="utf-8")
          )

          # Normal hikâye, onaylı aday yokken değişmemeli.
          normal = prepare_story_for_render(
              story,
              supplied_story=False
          )
          assert normal == story
          print("TEST 1: Normal hikaye korundu.")

          # Önceden onaylanmış özel gün hikâyesi değişmemeli.
          special = prepare_story_for_render(
              story,
              supplied_story=True
          )
          assert special == story
          print("TEST 2: Ozel gun hikayesi korundu.")

          print("TEST 3: Uretim kodunda kopru baglantisi bulundu.")
          print("TEST 4: Otomatik onay kapali.")
          print("TUM TESTLER BASARILI - VIDEO YAYINLANMADI.")
          PY

      - name: Check independent video preview safety (No Publish)
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("minomasal_masalsi_video_test.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)

          # Test dosyası yayın iş akışını çağırmamalı.
          forbidden = [
              "youtube_upload(",
              "media_publish",
              "minomasal_daily_live",
              "minomasal_dual_publish",
              "minomasal_facebook_daily",
              "minomasal_yayin_durumu.json",
              "minomasal_platform_durumu.json",
              "minomasal_onizleme_durumu.json",
          ]

          for item in forbidden:
              assert item not in source, (
                  f"Guvenlik kontrolu: {item}"
              )

          calls = [
              node for node in ast.walk(tree)
              if isinstance(node, ast.Call)
          ]

          # Doğrudan produce() kullanılmalı.
          produce_calls = [
              node for node in calls
              if isinstance(node.func, ast.Name)
              and node.func.id == "produce"
          ]

          assert len(produce_calls) == 1
          assert any(
              keyword.arg == "supplied_story"
              for keyword in produce_calls[0].keywords
          )

          assert "masalsi_video_onizleme.mp4" in source

          print("TEST 1: Dogrudan video uretimi baglantisi DOGRU")
          print("TEST 2: Onayli hikaye aktarimi DOGRU")
          print("TEST 3: Bilinen yayin ve kayit cagrilari BULUNMADI")
          print("STATIK KONTROL BASARILI - VIDEO URETILMEDI")
          PY

      - name: Diagnose new story masalsi conversion (No Video)
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          python - <<'PY'
          import ast
          import json
          import os
          import re
          from pathlib import Path
          import requests

          from minomasal_masalsi_guvenli import prepare_masalsi_safely

          source = Path("minomasal.py")
          tree = ast.parse(source.read_text(encoding="utf-8"))

          functions = [
              node for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name in ("validate", "create_story")
          ]

          assert len(functions) == 2

          namespace = {
              "Path": Path,
              "json": json,
              "re": re,
              "requests": requests,
              "__file__": str(source.resolve()),
          }

          exec(
              compile(
                  ast.Module(body=functions, type_ignores=[]),
                  "story_test",
                  "exec"
              ),
              namespace
          )

          key = os.environ["POLLINATIONS_API_KEY"]
          topic = "Arkadaşına Yardım Eden Minik Fil"

          story = namespace["create_story"](topic, key, "openai")

          print("TEST KONUSU:", topic)
          print("ORIJINAL SAHNE:", len(story["scenes"]))
          print(
              "ORIJINAL KELIME:",
              sum(len(s["narration"].split()) for s in story["scenes"])
          )

          original, candidate = prepare_masalsi_safely(
              story, key, model="openai"
          )

          if candidate is None:
              print("SONUC: Orijinal hikaye korundu.")
          else:
              print("SONUC: Masalsi aday olusturuldu.")
              print(
                  "MASALSI KELIME:",
                  sum(len(s.split()) for s in candidate)
              )

          print("METIN TESTI TAMAMLANDI - VIDEO YAYINLANMADI.")
          PY

      - name: Verify character dictionary (No Publish)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("minomasal_karakterler.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          characters = data["characters"]
          mapping = data["story_characters_31_100"]

          assert len(characters) == 44
          assert len(mapping) == 70

          for number in range(31, 101):
              assert str(number) in mapping

              for species in mapping[str(number)]:
                  assert species in characters, (
                      f"Video {number}: tanimsiz karakter {species}"
                  )

          names = [c["name"] for c in characters.values()]
          assert len(names) == len(set(names)), (
              "Ayni isim birden fazla karaktere verilmis."
          )

          for species, character in characters.items():
              assert character.get("name")
              assert character.get("appearance_en")
              assert character.get("type_tr")

          expected = {
              "sincap": "Sisi",
              "zurafa": "Zeli",
              "fil": "Edi",
              "ejderha": "Dogo",
              "ari": "Mara",
              "roket": "Rokko",
              "elektrikli_otomobil": "İvi",
          }

          for species, name in expected.items():
              assert characters[species]["name"] == name

          print("44 KARAKTER KONTROL EDILDI")
          print("70 HIKAYE ESLESTIRMESI DOGRU")
          print("SABIT ISIMLER DOGRULANDI")
          print("TEST BASARILI - VIDEO YAYINLANMADI")
          PY
