
name: MinoMasal Masalsi Guvenlik Testi (No Publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test safe fallback
        run: |
          python - <<'PY'
          from minomasal_masalsi_kontrol import select_narrations

          original = [
              "Küçük fil ormanda arkadaşına yardım etti. "
              "Sonra birlikte güvenli bir yere gittiler."
          ] * 9 + [
              "Küçük fil çok sevindi. "
              "Sen bugün kime yardım edersin?"
          ]

          converted = [
              "Küçük fil ormanda arkadaşına yardım etmiş. "
              "Sonra birlikte güvenli bir yere gitmişler."
          ] * 9 + [
              "Küçük fil çok sevinmiş. "
              "Sen bugün kime yardım edersin?"
          ]

          # 1. Varsayılan: Onay yoksa orijinali koru.
          assert select_narrations(
              original, converted
          ) == original
          print("TEST 1: Onaysiz donusum reddedildi.")

          # 2. Onaylı ve geçerli dönüşüm kabul edilmeli.
          assert select_narrations(
              original, converted, approved=True
          ) == converted
          print("TEST 2: Gecerli donusum kabul edildi.")

          # 3. Eksik sahneli dönüşüm reddedilmeli.
          assert select_narrations(
              original, converted[:9], approved=True
          ) == original
          print("TEST 3: Eksik sahne reddedildi.")

          # 4. Son soruyu değiştiren dönüşüm reddedilmeli.
          wrong = converted.copy()
          wrong[-1] = (
              "Küçük fil çok sevinmiş. "
              "Bugün ne öğrendin?"
          )

          assert select_narrations(
              original, wrong, approved=True
          ) == original
          print("TEST 4: Degisen son soru reddedildi.")

          print("TUM TESTLER BASARILI - YAYIN YAPILMADI.")
          PY

      - name: Test masalsi application with real story (No Publish)
        run: |
          python - <<'PY'
          import json
          from copy import deepcopy
          from pathlib import Path
          from minomasal_masalsi_uygula import apply_masalsi

          story = json.loads(
              Path("hikaye_01.json").read_text(encoding="utf-8")
          )
          original = deepcopy(story)

          converted = [
              scene["narration"]
              for scene in story["scenes"]
          ]

          # Yalnızca test için geçici bir metin farkı oluştur.
          converted[0] = "Masalsı deneme: " + converted[0]

          # Onaysız dönüşüm orijinali korumalı.
          rejected = apply_masalsi(
              story, converted, approved=False
          )
          assert rejected == original
          print("TEST 1: Onaysiz hikaye korunuyor.")

          # Onaylı dönüşüm anlatıma uygulanmalı.
          accepted = apply_masalsi(
              story, converted, approved=True
          )
          assert accepted["scenes"][0]["narration"] == converted[0]
          print("TEST 2: Onayli anlatim uygulandi.")

          # Görseller ve karakter tanımları değişmemeli.
          assert accepted["characters"] == original["characters"]

          for old, new in zip(
              original["scenes"], accepted["scenes"]
          ):
              assert old["visual"] == new["visual"]

          print("TEST 3: Gorseller ve karakterler korundu.")

          # Kaynak hikaye değiştirilmemeli.
          assert story == original
          print("TEST 4: Orijinal JSON degismedi.")

          print("TUM TESTLER BASARILI - VIDEO YAYINLANMADI.")
          PY

      - name: Test masalsi AI module (No API, No Publish)
        run: |
          python -m pip install requests

          python - <<'PY'
          import json
          from copy import deepcopy
          from pathlib import Path
          from unittest.mock import patch
          import requests

          from minomasal_masalsi_oneri import create_masalsi_candidate
          from minomasal_masalsi_uygula import apply_masalsi

          story = json.loads(
              Path("hikaye_01.json").read_text(encoding="utf-8")
          )
          original = deepcopy(story)
          narrations = [
              s["narration"] for s in story["scenes"]
          ]
          
          print("SON SAHNE:", repr(narrations[-1]))
          print("SON KARAKTER:", repr(narrations[-1][-1]))


          class FakeResponse:
              def raise_for_status(self):
                  pass

              def json(self):
                  return {
                      "choices": [{
                          "message": {
                              "content": json.dumps({
                                  "scenes": narrations
                              }, ensure_ascii=False)
                          }
                      }]
                  }

          # API yanıtını taklit et. Gerçek API kullanılmaz.
          with patch(
              "minomasal_masalsi_oneri.requests.post",
              return_value=FakeResponse()
          ):
              candidate = create_masalsi_candidate(
                  story, "TEST_KEY"
              )

          assert len(candidate) == 10
          assert story == original
          print("TEST 1: Aday metin olusturuldu.")

          rejected = apply_masalsi(
              story, candidate, approved=False
          )
          assert rejected == original
          print("TEST 2: Onaysiz aday uygulanmadi.")

          # API hatasını taklit et.
          with patch(
              "minomasal_masalsi_oneri.requests.post",
              side_effect=requests.RequestException(
                  "Simulated API failure"
              )
          ):
              try:
                  create_masalsi_candidate(
                      story, "TEST_KEY"
                  )
              except requests.RequestException:
                  print("TEST 3: API hatasi yakalandi.")
              else:
                  raise AssertionError(
                      "API hatasi yakalanmadi."
                  )

          assert story == original
          print("TEST 4: Orijinal hikaye korundu.")
          print("TUM TESTLER BASARILI - YAYIN YAPILMADI.")
          PY

      - name: Test automatic masalsi fallback (No API, No Publish)
        run: |
          python - <<'PY'
          import json
          from copy import deepcopy
          from pathlib import Path
          from unittest.mock import patch

          from minomasal_masalsi_guvenli import prepare_masalsi_safely

          story = json.loads(
              Path("hikaye_01.json").read_text(encoding="utf-8")
          )
          original = deepcopy(story)

          candidate = [
              scene["narration"]
              for scene in story["scenes"]
          ]

          # TEST 1: AI basarili yanit veriyor.
          with patch(
              "minomasal_masalsi_guvenli.create_masalsi_candidate",
              return_value=candidate
          ):
              result, suggestion = prepare_masalsi_safely(
                  story, "TEST_KEY"
              )

          assert result == original
          assert suggestion == candidate
          assert result is not story
          print("TEST 1: Basarili aday olusturuldu.")

          # TEST 2: AI hata veriyor.
          with patch(
              "minomasal_masalsi_guvenli.create_masalsi_candidate",
              side_effect=RuntimeError("Test API hatasi")
          ):
              result, suggestion = prepare_masalsi_safely(
                  story, "TEST_KEY"
              )

          assert result == original
          assert suggestion is None
          print("TEST 2: AI hatasinda orijinal korundu.")

          # TEST 3: Kaynak hikaye degismedi.
          assert story == original
          print("TEST 3: Kaynak JSON degismedi.")

          print("TUM TESTLER BASARILI - YAYIN YAPILMADI.")
          PY

      - name: Real masalsi narration preview (No Publish)
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from minomasal_masalsi_guvenli import prepare_masalsi_safely

          story = json.loads(
              Path("hikaye_01.json").read_text(encoding="utf-8")
          )

          
          # Yalnızca bellekteki test kopyasını değiştir.
          # GitHub'daki onaylı JSON dosyasına dokunma.
          replacements = [
              (0, "bayrak görmüş.", "bayrak gördü."),
              (1, "yanına gelmiş.", "yanına geldi."),
          ]

          for index, old, new in replacements:
              narration = story["scenes"][index]["narration"]
              if old not in narration:
                  raise RuntimeError(
                      f"Test sahnesinde beklenen ifade bulunamadi: {old}"
                  )
              story["scenes"][index]["narration"] = narration.replace(
                  old, new, 1
              )

          print("TEST GIRISI: Ilk iki sahne -di'li gecmis zamana cevrildi.")


          original, candidate = prepare_masalsi_safely(
              story,
              os.environ["POLLINATIONS_API_KEY"]
          )

          if candidate is None:
              print("Masalsi donusum basarisiz. Orijinal korundu.")
              raise SystemExit(1)

          # Gercek zaman kipi donusumlerini dogrula.
          assert "bayrak gördü." in story["scenes"][0]["narration"]
          assert "bayrak görmüş." in candidate[0]

          assert "yanına geldi." in story["scenes"][1]["narration"]
          assert "yanına gelmiş." in candidate[1]

          assert len(candidate) == 10

          print("ZAMAN KIPI DONUSUM TESTI BASARILI")

          from copy import deepcopy
          from minomasal_masalsi_uygula import apply_masalsi

          original_story = deepcopy(story)

          # Gercek AI adayini yalnizca testte uygula.
          approved_preview = apply_masalsi(
              story, candidate, approved=True
          )

          assert story == original_story
          assert len(approved_preview["scenes"]) == 10

          for index in range(10):
              assert (
                  approved_preview["scenes"][index]["narration"]
                  == candidate[index]
              )
              assert (
                  approved_preview["scenes"][index]["visual"]
                  == story["scenes"][index]["visual"]
              )

          print("GERCEK AI ADAYI GUVENLI UYGULAMA TESTI BASARILI")
          print("ORIJINAL HIKAYE VE GORSELLER KORUNDU")

          from pathlib import Path
          import json

          # Yalnizca test amacli karsilastirma dosyasi.
          # Onayli ozel gun JSON dosyalarini degistirme.
          output = Path("masalsi_test_sonucu.json")

          output.write_text(
              json.dumps(
                  {
                      "status": "TEST_ONLY_NOT_APPROVED",
                      "original": original_story,
                      "masalsi_candidate": approved_preview
                  },
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("MASALSI TEST JSON DOSYASI HAZIR")

          print("MASALSI ANLATIM ON IZLEME")

          for i, (scene, text) in enumerate(
              zip(original["scenes"], candidate), 1
          ):
              print(f"\nSAHNE {i}")
              print("ESKI:", scene["narration"])
              print("MASALSI:", text)

          print("\nMANUEL KALITE ONAYI BEKLENIYOR.")
          print("VIDEO YAYINLANMADI.")
          PY
