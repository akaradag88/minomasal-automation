name: MinoMasal 10.7.2 Ozel Gun Baslik Kontrolu (NO PUBLISH)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        with:
          python-version: '3.11'
      - name: Validate current special title guard and source files
        run: python minomasal_45_46_title_preflight.py
