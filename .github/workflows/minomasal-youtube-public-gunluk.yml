name: MinoMasal YouTube Public Gunluk

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'

permissions:
  contents: write

concurrency:
  group: minomasal-preview-state
  cancel-in-progress: false

jobs:
  public-upload:
    # Legacy direct uploader bypasses the daily dual-platform lock and review.
    # Retired during recovery; do not re-enable as an alternative schedule.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-minomasal.txt
          python -m pip install google-api-python-client google-auth google-auth-httplib2
      - name: Generate and upload public video
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          MINOMASAL_YOUTUBE_UPLOAD: 'true'
          MINOMASAL_YOUTUBE_PRIVACY: 'public'
        run: python minomasal.py
      - name: Commit upload record
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minomasal_yayin_durumu.json minomasal_onizleme_durumu.json
          if git diff --cached --quiet; then
            echo 'No new upload record.'
            exit 0
          fi
          git commit -m 'Record MinoMasal public YouTube upload [skip ci]'
          git push origin HEAD:${{ github.event.repository.default_branch }}
