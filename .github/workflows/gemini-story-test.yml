name: Gemini Masal Testi (Yayin Yok)
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Masal konusu"
        required: true
        default: "Kucuk itfaiye araci ormanda mahsur kalan sincaba yardim ediyor"
permissions:
  contents: read
jobs:
  story-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MINOMASAL_STORY_MODEL: gemini-2.5-flash-lite
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/gemini-story-writer-safe-20261117
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests only
        run: python -m pip install requests
      - name: Check accessible Gemini models (no key printed)
        run: |
          python - <<'PY'
          import os, requests
          key=os.environ.get('GEMINI_API_KEY','')
          if not key: raise SystemExit('GEMINI_API_KEY secret missing')
          r=requests.get('https://generativelanguage.googleapis.com/v1beta/models',headers={'x-goog-api-key':key},timeout=30)
          print('ListModels HTTP status:',r.status_code)
          if not r.ok:
              try: print('API error:',r.json().get('error',{}).get('message','unknown')[:350])
              except ValueError: print('API returned non-JSON error')
              raise SystemExit(1)
          names=[m['name'].split('/')[-1] for m in r.json().get('models',[]) if 'generateContent' in m.get('supportedGenerationMethods',[])]
          print('Accessible generateContent models:',', '.join(names) if names else '(none)')
          preferred=['gemini-2.5-flash-lite','gemini-2.5-flash','gemini-3-flash','gemini-3.5-flash-lite']
          selected=next((n for n in preferred if n in names),None)
          if not selected: raise SystemExit('No approved story model available; stopping safely')
          print('Selected model:',selected)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('MINOMASAL_STORY_MODEL='+selected+chr(10))
          PY
      - name: Generate story only (no upload, no video)
        env:
          TOPIC: ${{ inputs.topic }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          from minomasal_gemini_story import generate_story
          topic = os.environ["TOPIC"]
          prompt = (
              "4-7 yas cocuklari icin Turkce, mantikli, sevecen ve ozgun bir masal yaz. "
              "Bir kahraman, bir sorun, yardimlasmayla cozum ve mutlu son olsun. "
              "Sahneler gorsel olarak birebir anlatimla uyumlu olsun. "
              "Tam 10 sahne, toplam 75-110 kelime, en fazla 4 karakter."
          )
          story = generate_story(topic, prompt)
          out = pathlib.Path("gemini-story-test.json")
          out.write_text(json.dumps(story, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PASS: 10 scenes; narration words:", sum(len(s["narration"].split()) for s in story["scenes"]))
          print("Title:", story["title"])
          print("Saved:", out)
          PY
      - name: Upload story result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-story-test
          path: gemini-story-test.json
          retention-days: 3
