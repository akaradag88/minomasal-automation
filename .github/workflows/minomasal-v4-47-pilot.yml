name: MinoMasal V4 47 Kamyon Pilot (NO PUBLISH)

on:
  workflow_dispatch:
    inputs:
      render_video:
        description: '47 icin gercek video uret; sosyal medyada YAYIN YOK'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: minomasal-preview-state
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        with:
          python-version: '3.11'

      - name: Preflight without API or publication
        env:
          PUBLISH_ENABLED: 'false'
          MINOMASAL_YOUTUBE_UPLOAD: 'false'
          MINOMASAL_30SN_TEST: 'false'
        run: python minomasal_v4_47_pilot.py

      - name: Install dependencies for video preview
        if: ${{ inputs.render_video == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          ASSET='ffmpeg-master-latest-linux64-gpl.tar.xz'
          REPO='BtbN/FFmpeg-Builds'
          gh release download latest --repo "$REPO" --pattern "$ASSET" --pattern 'checksums.sha256' --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          grep -F "$ASSET" checksums.sha256 | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$ASSET" -C "$RUNNER_TEMP/ffmpeg"
          FFMPEG_BIN="$(find "$RUNNER_TEMP/ffmpeg" -type f -name ffmpeg -print -quit)"
          test -n "$FFMPEG_BIN"
          BIN_DIR="$(dirname "$FFMPEG_BIN")"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$BIN_DIR:$PATH"
          ffmpeg -version
          python -m pip install --disable-pip-version-check -r "$GITHUB_WORKSPACE/requirements-minomasal.txt"
          python -m pip install --disable-pip-version-check 'faster-whisper>=1.1,<2'

      - name: Render V4 story 47 - NO PUBLISH
        if: ${{ inputs.render_video == true }}
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINOMASAL_GEMINI_FREE_TIER_CONFIRMED: ${{ vars.MINOMASAL_GEMINI_FREE_TIER_CONFIRMED || 'false' }}
          PUBLISH_ENABLED: 'false'
          MINOMASAL_YOUTUBE_UPLOAD: 'false'
          MINOMASAL_30SN_TEST: 'false'
        run: python minomasal_v4_47_pilot.py --render

      - name: Save video and story for human QA
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: minomasal-v4-47-pilot-no-publish
          retention-days: 5
          if-no-files-found: warn
          path: |
            minomasal_v4_47_pilot_rapor.json
            minomasal_v4_47_pilot_data/**/masal_short.mp4
            minomasal_v4_47_pilot_data/**/hikaye.json
            minomasal_v4_47_pilot_data/**/altyazi.srt
