name: MinoMasal 32 Instagram Media ID Check (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-instagram-post:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Find published Instagram media ID (no upload, no edits)
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          EXPECTED_SHORTCODE: DfAV8w4OjYG
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          user_id = os.environ.get('INSTAGRAM_USER_ID', '').strip()
          token = os.environ.get('INSTAGRAM_ACCESS_TOKEN', '').strip()
          shortcode = os.environ['EXPECTED_SHORTCODE'].strip()
          if not user_id or not token:
              raise SystemExit('Eksik GitHub Secret: INSTAGRAM_USER_ID veya INSTAGRAM_ACCESS_TOKEN')
          if not user_id.isdigit():
              raise SystemExit('INSTAGRAM_USER_ID sayisal olmali')

          fields = 'id,permalink,timestamp,media_type'
          params = urllib.parse.urlencode({'fields': fields, 'limit': 50})
          url = f'https://graph.facebook.com/v26.0/{user_id}/media?{params}'

          for page in range(1, 11):
              parsed = urllib.parse.urlparse(url)
              if parsed.scheme != 'https' or parsed.netloc != 'graph.facebook.com':
                  raise SystemExit('Guvenlik kontrolu: beklenmeyen API sayfalama adresi')
              req = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/json',
              })
              try:
                  with urllib.request.urlopen(req, timeout=35) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f'Instagram API HTTP {error.code}; token izinlerini ve suresini kontrol edin')
              except urllib.error.URLError:
                  raise SystemExit('Instagram API baglanti hatasi')

              for post in payload.get('data', []):
                  permalink = str(post.get('permalink') or '')
                  path_parts = [p for p in urllib.parse.urlparse(permalink).path.split('/') if p]
                  code = path_parts[-1] if len(path_parts) >= 2 and path_parts[-2] in ('p', 'reel', 'tv') else ''
                  if code == shortcode:
                      media_id = str(post.get('id') or '')
                      if not media_id.isdigit():
                          raise SystemExit('Eslesti ancak sayisal medya kimligi bulunamadi')
                      print('ESLESEN GONDERI BULUNDU')
                      print('Instagram media_id:', media_id)
                      print('Permalink:', permalink)
                      print('Yayim zamani:', post.get('timestamp', 'bilinmiyor'))
                      print('Medya turu:', post.get('media_type', 'bilinmiyor'))
                      print('Yalnizca okuma yapildi. Hicbir dosya degistirilmedi ve paylasim yapilmadi.')
                      sys.exit(0)

              print(f'{page}. sayfa tarandi; henuz eslesme yok.')
              url = (payload.get('paging') or {}).get('next')
              if not url:
                  break

          raise SystemExit('Gonderi API listesinde bulunamadi. Kaydi degistirmeyin; hesap ve izinleri inceleyin.')
          PY
